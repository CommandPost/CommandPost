        </p>

        <!-- Server Settings -->

                    onchange="console.log('[WebSocket] serverPort change event, value:', this.value); websocketPanelCallback('serverPort', {value: this.value})"
                    onblur="console.log('[WebSocket] serverPort blur event, value:', this.value); websocketPanelCallback('serverPort', {value: this.value})">
            </p>
        </div>

        <hr>

        <!-- Connection Status & Active Connections -->
        <div class="uiItem status-display">
            <div id="statusIndicator" class="status-badge status-disconnected">
                已断开
            </div>
            <div id="connectionInfo" class="connection-info"></div>
            <button onclick="websocketPanelCallback('refreshStatus', {})" class="button-text">
                刷新
            </button>
        </div>

        <div class="uiItem connections-list-container">
            <div id="connectionsList" class="connections-list">
                <p class="no-connections">暂无活动连接</p>
            </div>
        </div>

        <hr>

        <!-- Action Query Section -->
        <h3 class="uiItem">动作查询</h3>

        <p class="uiItem" style="text-align: center; padding: 10px 0;">
            <label for="actionAppFilter"
                style="display:block; margin-bottom:8px; font-size:12px; color:#888;">按应用筛选动作：</label>
            <select id="actionAppFilter" style="width: 60%; padding:6px; margin-right:8px;">
                <option value="">所有应用</option>

            </select>
            <a id="openActionChooser" href="#" class="button"
                style="padding: 8px 18px; font-size: 13px; vertical-align: middle;">
                🔍 打开动作选择器
            </a>
        </p>

        <p class="uiItem" style="color: #666; font-size: 12px; text-align: center; font-style: italic;">
            点击上方按钮打开 CommandPost 动作选择器,浏览和搜索所有可用的动作
        </p>

        <!-- Selected Action Display -->
        <div class="uiItem" id="selectedActionDisplay" style="display: none;">
            <div
                style="background-color: #252525; border: 2px solid #1990ff; border-radius: 6px; padding: 15px; margin-top: 10px;">

                    <p
                        style="margin: 0; color: #1990ff; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">
                        当前选中的动作
                    </p>
                    <button id="copyMessageBtn" onclick="copyMessageToClipboard()" class="button-text"
                        style="background-color: #1990ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: background-color 0.2s;">
                        📋 复制消息
                    </button>
                </div>
                <p id="selectedActionTitle" style="margin: 0; font-size: 14px; font-weight: 600; color: #fff;"></p>
                <p id="selectedActionHandler"
                    style="margin: 5px 0 0 0; font-size: 11px; font-family: monospace; color: #888;"></p>
                <p id="selectedActionJson"
                    style="margin: 10px 0 0 0; font-size: 10px; font-family: monospace; color: #666; white-space: pre-wrap; word-break: break-all;">
                </p>
            </div>
        </div>

    <script>
        // Helper function to send messages via postMessage
        function websocketPanelCallback(id, params) {
            console.log('[WebSocket] websocketPanelCallback called - id:', id, 'params:', params);
            try {
                var result = {
                    id: "websocketPanelCallback",
                    params: Object.assign({ type: id }, params),
                };
                console.log('[WebSocket] Sending postMessage:', result);
                postMessage(result);
            } catch (err) {
                console.error('[WebSocket] Error in websocketPanelCallback:', err);
                alert("Error: " + err);
            }
        }


        // Copy WebSocket message to clipboard
        function copyMessageToClipboard() {
            try {
                var actionJsonElement = document.getElementById("selectedActionJson");
                var actionJsonText = actionJsonElement.textContent || actionJsonElement.innerText;

                if (!actionJsonText || actionJsonText.trim() === "") {
                    alert("没有可复制的消息");
                    return;
                }

                console.log("[WebSocket] actionJsonText:", actionJsonText);

                // Extract JSON from the text (removes the "WebSocket 消息示例:" prefix)
                var jsonString = actionJsonText;
                var match = actionJsonText.match(/\{[\s\S]*\}/);
                if (match) {
                    jsonString = match[0];
                }

                console.log("[WebSocket] Extracted JSON string:", jsonString);

                // Parse the JSON to extract handler and actionId
                var messageData;
                try {
                    messageData = JSON.parse(jsonString);
                } catch (e) {
                    console.error("[WebSocket] JSON parse error:", e);
                    alert("无法解析消息数据: " + e.message);
                    return;
                }

                // Construct a new WebSocket message with a fresh ID
                var message = {
                    type: "command",
                    id: "msg-" + Date.now(),
                    payload: messageData.payload
                };

                var messageString = JSON.stringify(message, null, 2);

                console.log("[WebSocket] Message to copy:", messageString);

                // Try using navigator.clipboard if available
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(messageString).then(function () {
                        showCopySuccess();
                        console.log("[WebSocket] Message copied to clipboard successfully");
                    }).catch(function (err) {
                        console.error("[WebSocket] navigator.clipboard failed:", err);
                        // Fallback to postMessage
                        copyViaPostMessage(messageString);
                    });
                } else {
                    console.log("[WebSocket] navigator.clipboard not available, using postMessage");
                    copyViaPostMessage(messageString);
                }
            } catch (err) {
                console.error("[WebSocket] Error in copyMessageToClipboard:", err);
                alert("复制失败: " + err);
            }
        }

        // Fallback: copy via postMessage to Lua
        function copyViaPostMessage(text) {
            websocketPanelCallback('copyToClipboard', { text: text });
        }

        // Show success feedback
        function showCopySuccess() {
            var copyBtn = document.getElementById("copyMessageBtn");
            var originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = "✅ 已复制";
            copyBtn.style.backgroundColor = "#28a745";

            setTimeout(function () {
                copyBtn.innerHTML = originalText;
                copyBtn.style.backgroundColor = "#1990ff";
            }, 2000);
        }

        // Called from Lua when copy succeeds
        function onCopySuccess() {
            showCopySuccess();
            console.log("[WebSocket] Copy successful via Lua");
        }

        // Called from Lua when copy fails
        function onCopyError(error) {
            console.error("[WebSocket] Copy failed via Lua:", error);
            alert("复制失败: " + error);
        }

        // Initialize immediately when script runs
        (function () {
            console.log('[WebSocket] Initializing panel JavaScript');

            // Setup Action Chooser button
            var chooserButton = document.getElementById("openActionChooser");
            if (chooserButton) {
                chooserButton.onclick = function () {
                    var filterElem = document.getElementById('actionAppFilter');
                    var bundleID = filterElem ? filterElem.value : "";
                    websocketPanelCallback('openActionChooser', { bundleID: bundleID });
                };
            }

            // Request available apps to populate the filter when panel loads
            try {
                websocketPanelCallback('requestAppList', {});
            } catch (e) {
                console.warn('[WebSocket] requestAppList failed:', e);
            }
        })();
    </script>
</body>
